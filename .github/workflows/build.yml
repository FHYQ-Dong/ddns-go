name: build-authheader
on:
  schedule:
    - cron: '0 3 * * *'   # daily; GitHub may delay scheduled runs
  workflow_dispatch:
permissions:
  contents: write   # create the release marker
  packages: write   # push to GHCR
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - id: up
        env: { GH_TOKEN: '${{ github.token }}' }
        run: echo "tag=$(gh api repos/jeessy2/ddns-go/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - id: check
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "${{ steps.up.outputs.tag }}-authheader" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.build == 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.up.outputs.tag }}" https://github.com/jeessy2/ddns-go upstream
          git -C upstream apply "${{ github.workspace }}/patches/authheader.patch"
          cp Dockerfile upstream/Dockerfile
      - if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.check.outputs.build == 'true'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}' }
      - if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          platforms: linux/amd64            # homelab is amd64; add linux/arm64 (+ setup-qemu-action) if needed
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/ddns-go:${{ steps.up.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.lc }}/ddns-go:latest
      - if: steps.check.outputs.build == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "${{ steps.up.outputs.tag }}-authheader" -R "${{ github.repository }}" \
            -t "${{ steps.up.outputs.tag }}-authheader" \
            -n "Auto-built from upstream ${{ steps.up.outputs.tag }} + authheader patch. Image: ghcr.io/${{ steps.owner.outputs.lc }}/ddns-go:${{ steps.up.outputs.tag }}"
